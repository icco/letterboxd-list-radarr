name: Container image
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 15b6387c433ca05a2e0ab81ad1e92eb49cd36ffe
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push'
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-15b6387c433ca05a2e0ab81ad1e92eb49cd36ffe
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
          flavor: latest=false
          labels: org.opencontainers.image.revision=15b6387c433ca05a2e0ab81ad1e92eb49cd36ffe
      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: node:18-alpine=docker-image://node:24-alpine
