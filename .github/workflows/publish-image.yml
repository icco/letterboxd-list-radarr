name: Container image
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: letterboxd-list-radarr:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify runtime and Redis-backed HTTP
        run: |
          docker network create letterboxd-test
          trap 'docker logs letterboxd-app; docker rm -f letterboxd-app letterboxd-redis; docker network rm letterboxd-test' EXIT
          docker run -d --name letterboxd-redis --network letterboxd-test redis:8-alpine
          for attempt in $(seq 1 30); do
            if docker exec letterboxd-redis redis-cli ping; then break; fi
            sleep 1
          done
          docker exec letterboxd-redis redis-cli SET /alice/list/smoke/ '[{"slug":"/film/ada/","title":"Ada Lovelace"}]'
          docker exec letterboxd-redis redis-cli SET /film/ada/ '{"slug":"/film/ada/","name":"Ada Lovelace","published":"2020","imdb":"tt1234567","tmdb":"123"}'
          docker run --rm letterboxd-list-radarr:test node --check dist/index.js
          docker run -d --name letterboxd-app --network letterboxd-test -e REDIS_URL=redis://letterboxd-redis:6379 letterboxd-list-radarr:test
          for attempt in $(seq 1 30); do
            if docker logs letterboxd-app 2>&1 | grep -q 'Redis ready'; then
              docker exec letterboxd-app node -e 'const assert = require("node:assert/strict"); (async () => { const root = await fetch("http://127.0.0.1:5000/"); assert.equal(root.status, 200); const response = await fetch("http://127.0.0.1:5000/alice/list/smoke/?limit=1"); assert.equal(response.status, 200); assert.deepEqual(await response.json(), [{id:123,imdb_id:"tt1234567",title:"Ada Lovelace",release_year:"2020",clean_title:"/film/ada/",adult:false}]); })().catch(error => { console.error(error); process.exit(1); });'
              exit
            fi
            sleep 1
          done
          exit 1
  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
          flavor: latest=false
      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
